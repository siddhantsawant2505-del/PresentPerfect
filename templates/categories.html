<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Exploration — PresentPerfect</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Boutique Header -->
  <header class="boutique-header">
    <div class="header-container">
      <a href="/" class="brand-wrapper">
        <div class="brand-emblem">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
        </div>
        <span class="brand-name">Present<em>Perfect</em></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link-btn">Home</a></li>
          <li><a href="/mycart.html" class="nav-link-btn">My Cart</a></li>
          <li><a href="/myorder.html" class="nav-link-btn">My Orders</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="cart-pill-btn cart-toggle-trigger" onclick="window.location.href='/mycart.html'">
          <span>Box</span>
          <span class="cart-count-badge">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="catalog-section" style="margin-top: 40px;">
    <div class="catalog-header">
      <span class="section-eyebrow">Curated Collection</span>
      <h1 class="section-title">Gifts in: <span id="categoryTitle" style="color: var(--color-accent); text-transform: capitalize;">All</span></h1>
      <p class="section-subtitle">Hand-inspected keepsakes ready for gift-wrapping in our signature lavender silk box.</p>
    </div>

    <!-- Category Filter Bar -->
    <div class="category-filter-bar">
      <button class="category-filter-btn" data-category="all" onclick="changeFilter('category', 'all')">All</button>
      <button class="category-filter-btn" data-category="luxury" onclick="changeFilter('category', 'luxury')">💎 Luxury</button>
      <button class="category-filter-btn" data-category="handmade" onclick="changeFilter('category', 'handmade')">🌿 Handmade</button>
      <button class="category-filter-btn" data-category="chocolate" onclick="changeFilter('category', 'chocolate')">🍫 Chocolates</button>
      <button class="category-filter-btn" data-category="personalized" onclick="changeFilter('category', 'personalized')">✨ Personalized</button>
      <button class="category-filter-btn" data-category="fashion" onclick="changeFilter('category', 'fashion')">⌚ Fashion & Silk</button>
    </div>

    <div id="boutiqueGrid" class="boutique-grid"></div>
  </main>

  <footer class="boutique-footer">
    <div class="footer-container">
      <div class="footer-bottom">
        <div>© 2026 PresentPerfect Ateliers Inc.</div>
        <div>Lavender & Amethyst Silk Edition</div>
      </div>
    </div>
  </footer>

  <script src="/static/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cat = urlParams.get('category');
      const occ = urlParams.get('occasion');

      if (cat) {
        document.getElementById('categoryTitle').textContent = cat + ' Gifts';
        setCategoryFilter(cat);
      } else if (occ) {
        document.getElementById('categoryTitle').textContent = occ + ' Celebration Gifts';
        setOccasionFilter(occ);
      }
    });

    function changeFilter(type, val) {
      if (type === 'category') {
        window.location.href = `/categories.html?category=${encodeURIComponent(val)}`;
      }
    }
  </script>
</body>
</html>
