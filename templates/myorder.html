<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Celebrations & Orders — PresentPerfect</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .orders-wrapper {
      max-width: 900px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }
    .order-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: var(--shadow-card);
      margin-bottom: 24px;
      position: relative;
    }
    .order-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .order-badge-status {
      background: var(--color-accent-light);
      color: var(--color-accent);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .order-item-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--color-surface-subtle);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header class="boutique-header">
    <div class="header-container">
      <a href="/" class="brand-wrapper">
        <div class="brand-emblem">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
        </div>
        <span class="brand-name">Present<em>Perfect</em></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link-btn">Boutique</a></li>
          <li><a href="/mycart.html" class="nav-link-btn">Gift Box</a></li>
          <li><a href="/myorder.html" class="nav-link-btn" style="color: var(--color-accent); font-weight:600;">My Orders</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button onclick="clearHistory()" class="btn-secondary-luxury" style="padding: 7px 16px; font-size: 12.5px;">Clear History</button>
      </div>
    </div>
  </header>

  <main class="orders-wrapper">
    <div style="margin-bottom: 30px;">
      <span class="section-eyebrow">Client Record</span>
      <h1 class="section-title">Your Celebration Orders</h1>
    </div>

    <div id="ordersContainer">
      <!-- Injected via script -->
    </div>
  </main>

  <script>
    function loadOrders() {
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="order-card" style="text-align: center; padding: 60px 20px;">
            <div style="font-size: 38px; margin-bottom: 12px;">📜</div>
            <h3 style="font-size: 20px; color: var(--color-primary); margin-bottom: 6px;">No recent gifting orders</h3>
            <p style="color: var(--color-text-secondary); margin-bottom: 20px;">When you dispatch a curated gift box, your tracking and calligraphy proofs appear here.</p>
            <a href="/" class="btn-primary-luxury">Explore Collection</a>
          </div>
        `;
        return;
      }

      orders.forEach((order, idx) => {
        const card = document.createElement('div');
        card.className = 'order-card';
        const items = order.items || order.cart || [];
        const orderNum = 'PP-' + (84920 + idx);
        const date = order.date || order.timestamp || 'Recent Order';
        const total = order.total || ('$' + order.totalAmount);

        let itemsHtml = items.map(i => `
          <div class="order-item-chip">
            <span style="font-weight: 600; color: var(--color-primary);">${i.name} (x${i.quantity || 1})</span>
            <span style="font-weight: 700; color: var(--color-accent);">$${((i.price || 0) * (i.quantity || 1)).toFixed(2)}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="order-header-row">
            <div>
              <div style="font-size: 13px; font-weight: 700; color: var(--color-accent);">${orderNum}</div>
              <h3 style="font-size: 18px; color: var(--color-primary); margin-top: 2px;">Celebration Gift Box</h3>
              <div style="font-size: 13px; color: var(--color-text-muted);">${date}</div>
            </div>
            <div class="order-badge-status">
              <span>✦</span>
              <span>${order.status || 'Dispatched with Courier'}</span>
            </div>
          </div>

          <div style="margin-bottom: 16px;">
            <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 8px;">Enclosed Treasures</div>
            ${itemsHtml}
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-border); padding-top: 14px;">
            <div style="font-size: 13.5px; color: var(--color-text-secondary);">Packaging: <strong>Signature Lavender Box & Silk Ribbon</strong></div>
            <div style="font-size: 18px; font-weight: 700; color: var(--color-primary);">Total: <span style="color: var(--color-accent);">${total}</span></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function clearHistory() {
      if (confirm('Clear your local celebration order history?')) {
        localStorage.removeItem('orders');
        loadOrders();
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
